name: Scheduled Repo Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Updated to v4 for Node 24 support
      
      - name: Sync from Upstream
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/F100Pilot/stremio-addon-streamimdb.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || echo "Already up to date, skipping merge."
          git push origin main || echo "No changes to push."
