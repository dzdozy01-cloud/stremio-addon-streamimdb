name: Scheduled Repo Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Upstream
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git remote add upstream https://github.com/F100Pilot/stremio-addon-streamimdb.git
          git fetch upstream
          git checkout main
          # This line merges changes ONLY if they exist, otherwise it just prints a message
          git merge upstream/main --ff-only || echo "Already up to date."
          git push origin main || echo "Nothing to push."
